name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Snapshot the live Firestore data before every deploy, so a future
      # data loss always has a recent restore point. Goes to a *private*
      # backups repo, never this one — this repo is public, and the data
      # includes account balances, bill amounts, and plaintext login PINs.
      # Requires a one-time setup: a private "family-hub-backups" repo and a
      # BACKUP_REPO_TOKEN secret (fine-grained PAT scoped to that repo only)
      # added under Settings > Secrets and variables > Actions. Until that's
      # set up, these steps fail harmlessly and the deploy still proceeds.
      - name: Checkout backups repo
        id: backup_checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: JustADiveBum26/family-hub-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup-repo

      - name: Back up Firestore data
        if: steps.backup_checkout.outcome == 'success'
        continue-on-error: true
        run: node scripts/backup-firestore.js
        env:
          BACKUP_OUT_DIR: backup-repo/backups

      - name: Commit and push backup
        if: steps.backup_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: backup-repo
        run: |
          git config user.name "family-hub-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No data changes since last backup."
          else
            git commit -m "Backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Build
        run: ./node_modules/.bin/vite build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4